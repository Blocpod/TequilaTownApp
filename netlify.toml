# Tequila Town — Netlify site (static web/ + Functions v2 + Blobs).
# No build step: web/ is published as-is and Netlify bundles netlify/functions/*.mts.

[build]
  publish = "web"
  functions = "netlify/functions"

[build.environment]
  # Functions run on the build's Node version (@netlify/blobs needs >= 22.12).
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[dev]
  # `netlify dev` serves web/ and the functions on http://localhost:8888
  port = 8888
  framework = "#static"
  autoLaunch = false

# Pretty URLs for the legal/support pages (Google Play needs a deletion URL).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/support.html#delete-account"
  status = 301

# Security headers for the static pages. (Scoped to HTML so they never stack with
# the CSP the share function sets on /m/* and /s/*.)
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
